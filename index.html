<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockAI — Enterprise Stock Metadata Engine</title>
  <meta name="description" content="StockAI is an enterprise AI-powered stock metadata engine. Generate SEO-optimized titles, descriptions, and keywords for Adobe Stock, Shutterstock, Freepik, and more." />
  <meta name="application-name" content="StockAI" />
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var _fetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
