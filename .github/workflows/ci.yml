name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Stub DATABASE_URL so prisma generate (not db push) succeeds without a real DB
      DATABASE_URL: "postgresql://user:pass@localhost:5432/stub?sslmode=disable"
      JWT_SECRET: "ci-stub-jwt-secret-minimum-32-characters-long"
      STOCKAI_KEY_ENCRYPTION_SECRET: "ci-stub-encryption-secret-32-chars-minimum"
      GEMINI_API_KEY: "ci-stub-key"
      SKIP_DB_PUSH: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --no-audit --no-fund

    - name: Lint (TypeScript check)
      run: npm run lint

    - name: Build
      run: npm run build
